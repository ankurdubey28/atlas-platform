name: CI

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ "main" ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:


jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      api: ${{ steps.filter.outputs.api }}
      migration: ${{ steps.filter.outputs.migration }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - "cmd/api/**"
              - "internal/**"
              - "go.mod"
              - "go.sum"
              - "Dockerfile"
            
            migration:
              - "cmd/migrate/**"
              - "Dockerfile"
            

  build-test:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Setup Go Environment and tooling
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Perform linting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...


  push:
    runs-on: ubuntu-latest
    needs: [changes,build-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: needs.changes.outputs.api=='true' || github.event_name=='workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/atlas-api:${{ github.run_id }}

      - name: Build and push Migration image
        if: needs.changes.outputs.migration=='true' || github.event_name=='workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ghrc.io/${{github.repository_owner}}/atlas-migrate:${{github.run_id}}


  update-helm:
    runs-on: ubuntu-latest
    needs: [push,changes]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update API Helm tag
        if: needs.changes.outputs.api == 'true' || github.event_name=='workflow_dispatch'
        run: |
          yq -i '.images.api.tag = "${{ github.run_id }}"' \
            helm/atlas-platform-chart/values.yaml

      - name: Update migration Helm tag
        if: needs.changes.outputs.migration == 'true' || github.event_name=='workflow_dispatch'
        run: |
          yq -i '.images.migration.tag = "${{ github.run_id }}"' \
            helm/atlas-platform-chart/values.yaml

      - name: Commit and Push changes made to values.yaml
        env:
          CI_GIT_NAME: ${{vars.CI_BOT_NAME}}
          CI_GIT_EMAIL: ${{vars.CI_BOT_EMAIL}}
        run: |
          git config --global user.email "$CI_GIT_NAME"
          git config --global user.name "CI_GIT_EMAIL"
          git add helm/atlas-platform-chart/values.yaml
          git commit -m "chore(helm): update image tags [skip ci]"
          git push