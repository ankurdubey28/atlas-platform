version: "3"

vars:
  PLATFORM: linux/amd64
  IMAGE_NAME: atlas-platform
  CONTAINER_NAME: atlas-platform
  MANIFEST_DIR: K8s/manifest
  TAG: 1.0.0

tasks:
  # -------------------------
  # Docker Compose workflow
  # -------------------------

  build-api:
    desc: Build API image for {{.PLATFORM}} architecture
    cmd: docker compose build api

  run-api:
    desc: Run API container
    cmd: docker compose up -d api

  run-db:
    desc: Run PostgreSQL container
    cmd: docker compose up -d postgres

  compose-migrations:
    desc: Apply Goose migrations using Docker Compose
    cmd: docker compose run --rm migrate

  up:
    desc: One-click Docker Compose development setup
    cmds:
      - task: build-api
      - task: run-db
      - task: compose-migrations
      - task: run-api

  clean:
    desc: Stop and remove Docker Compose containers, networks, and volumes
    cmd: docker compose down -v

