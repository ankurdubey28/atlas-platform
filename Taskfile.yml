version: "3"

vars:
  PLATFORM: linux/amd64
  IMAGE_NAME: atlas-platform
  CONTAINER_NAME: atlas-platform
  MANIFEST_DIR: K8s/manifest
  TAG: 1.0.0

tasks:
  # -------------------------
  # Docker Compose workflow
  # -------------------------

  build-api:
    desc: Build API image for {{.PLATFORM}} architecture
    cmd: docker compose build api

  run-api:
    desc: Run API container
    cmd: docker compose up -d api

  run-db:
    desc: Run PostgreSQL container
    cmd: docker compose up -d postgres

  compose-migrations:
    desc: Apply Goose migrations using Docker Compose
    cmd: docker compose run --rm migrate

  up:
    desc: One-click Docker Compose development setup
    cmds:
      - task: build-api
      - task: run-db
      - task: compose-migrations
      - task: run-api

  clean:
    desc: Stop and remove Docker Compose containers, networks, and volumes
    cmd: docker compose down -v

  # -------------------------
  # Kubernetes workflow
  # -------------------------

  apply-configmap:
    desc: Apply ConfigMap
    cmd: kubectl apply -f {{.MANIFEST_DIR}}/cm.yaml

  apply-secret:
    desc: Apply Kubernetes Secret
    cmd: kubectl apply -f {{.MANIFEST_DIR}}/secret.yaml

  apply-postgres:
    desc: Apply PostgreSQL Service and StatefulSet
    cmd: kubectl apply -f {{.MANIFEST_DIR}}/statefulset.yaml

  wait-postgres:
    desc: Wait for PostgreSQL to become ready
    cmd: kubectl wait --for=condition=Ready pod/postgres-0 --timeout=120s

  apply-k8s-migrations:
    desc: Run database migrations in Kubernetes
    cmds:
      - kubectl delete job atlas-migrate-job --ignore-not-found
      - kubectl apply -f {{.MANIFEST_DIR}}/job.yaml
      - kubectl wait --for=condition=complete job/atlas-migrate-job --timeout=120s

  apply-deployment:
    desc: Apply Atlas API Deployment
    cmd: kubectl apply -f {{.MANIFEST_DIR}}/deployment.yaml

  wait-api:
    desc: Wait for Atlas API rollout
    cmd: kubectl rollout status deployment/atlas-api-deployment --timeout=120s

  apply-service:
    desc: Apply Atlas API Service
    cmd: kubectl apply -f {{.MANIFEST_DIR}}/service.yaml

  apply-ingress:
    desc: Apply Atlas API Ingress
    cmd: kubectl apply -f {{.MANIFEST_DIR}}/ingress.yaml

  deploy:
    desc: Deploy the complete Atlas platform to Kubernetes
    cmds:
      - task: apply-configmap
      - task: apply-secret
      - task: apply-postgres
      - task: wait-postgres
      - task: apply-k8s-migrations
      - task: apply-deployment
      - task: wait-api
      - task: apply-service
      - task: apply-ingress